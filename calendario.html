<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Meu Organizador • Calendário</title><link rel="stylesheet" href="css/style.css"></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">✦</span><div><strong>Meu Organizador</strong><small>seu cantinho de rotina</small></div></div><nav><a class="nav-link" href="index.html">🏠 <span>Hoje</span></a><a class="nav-link active" href="calendario.html">📅 <span>Calendário</span></a><a class="nav-link" href="estudos.html">📚 <span>Estudos</span></a><a class="nav-link" href="projetos.html">💼 <span>Projetos</span></a></nav><div class="sidebar-bottom"><span id="userEmail" class="user-email"></span><button id="notificationBtn" class="ghost-btn">🔔 Notificações</button><button id="logoutBtn" class="ghost-btn">↪ Sair</button></div></aside><main class="main-content"><header class="topbar"><button class="mobile-menu" id="mobileMenu">☰</button><div><p class="eyebrow">PLANEJAMENTO</p><h1>Calendário</h1></div><button class="icon-btn" id="themeBtn">☼</button></header><section class="calendar-layout"><div class="panel calendar-panel"><div class="calendar-toolbar"><button class="icon-btn" id="prevMonth">‹</button><h2 id="monthTitle"></h2><button class="icon-btn" id="nextMonth">›</button><button class="today-btn" id="goToday">Hoje</button></div><div class="weekdays"><span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span></div><div id="calendarGrid" class="calendar-grid"></div></div><aside class="panel day-panel"><div class="panel-heading"><div><span class="eyebrow">DIA SELECIONADO</span><h2 id="selectedDateTitle">Selecione um dia</h2></div><button class="primary-btn" id="addEventBtn">+ Evento</button></div><div id="selectedEvents"></div><div id="emptySelected" class="empty-state">Clique em um dia para ver seus compromissos.</div></aside></section></main></div><div id="modal" class="modal hidden"><div class="modal-box"><button class="modal-close" data-close>×</button><h2>Novo compromisso</h2><form id="eventForm"><label>Título<input id="eventTitle" required></label><div class="form-row"><label>Data<input id="eventDate" type="date" required></label><label>Horário<input id="eventTime" type="time"></label></div><label>Categoria<select id="eventCategory"><option>Faculdade</option><option>Projeto</option><option>Pessoal</option><option>Outro</option></select></label><label>Descrição<textarea id="eventNotes" rows="3"></textarea></label><button class="primary-btn full">Salvar compromisso</button></form></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script type="module" src="js/app.js"></script><script type="module" src="js/calendario.js"></script></body></html>
