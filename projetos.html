<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Meu Organizador • Projetos</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="app-shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">✦</span><div><strong>Meu Organizador</strong><small>seu cantinho de rotina</small></div></div><nav><a class="nav-link" href="index.html">🏠 <span>Hoje</span></a><a class="nav-link" href="calendario.html">📅 <span>Calendário</span></a><a class="nav-link" href="estudos.html">📚 <span>Estudos</span></a><a class="nav-link active" href="projetos.html">💼 <span>Projetos</span></a></nav><div class="sidebar-bottom"><button id="notificationBtn" class="ghost-btn">🔔 Ativar notificações</button></div></aside>
<main class="main-content"><header class="topbar"><button class="mobile-menu" id="mobileMenu">☰</button><div><p class="eyebrow">PROJETOS</p><h1>O que está acontecendo? 💼</h1></div><div class="top-actions"><button class="icon-btn" id="themeBtn">☼</button></div></header>
<section class="panel"><div class="panel-heading"><div><span class="eyebrow">SEUS PROJETOS</span><h2>Projetos</h2></div><button class="primary-btn" id="addProjectBtn">+ Projeto</button></div><div id="projectGrid" class="project-grid"></div><div id="emptyProjects" class="empty-state">Crie seu primeiro projeto.</div></section>
</main></div>
<div id="modal" class="modal hidden"><div class="modal-box"><button class="modal-close" data-close>×</button><h2>Novo projeto</h2><form id="projectForm"><label>Nome<input id="projectName" required placeholder="Ex.: Compoweek"></label><label>Descrição<textarea id="projectDescription" rows="3"></textarea></label><div class="form-row"><label>Cor<select id="projectColor"><option value="purple">Lilás</option><option value="blue">Azul</option><option value="green">Verde</option><option value="orange">Laranja</option></select></label><label>Prazo<input id="projectDeadline" type="date"></label></div><button class="primary-btn full" type="submit">Criar projeto</button></form></div></div>
<script src="js/app.js"></script><script src="js/projetos.js"></script>
</body></html>
