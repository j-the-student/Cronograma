<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Meu Organizador • Entrar
    </title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="auth-page">


    <div class="auth-card">


        <!-- MARCA -->
        <div class="brand auth-brand">

            <span class="brand-mark">
                ✦
            </span>

            <div>

                <strong>
                    Meu Organizador
                </strong>

                <small>
                    seu cantinho de rotina
                </small>

            </div>

        </div>


        <!-- TÍTULO -->
        <h1>
            Bem-vinda! 🌷
        </h1>


        <p class="muted">
            Entre para acessar seu organizador
            de qualquer dispositivo.
        </p>


        <!-- LOGIN -->
        <form id="loginForm">

            <label>

                E-mail

                <input
                    id="email"
                    type="email"
                    autocomplete="email"
                    placeholder="seu@email.com"
                    required>

            </label>


            <label>

                Senha

                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    minlength="6"
                    placeholder="••••••••"
                    required>

            </label>


            <button
                class="primary-btn full"
                type="submit">

                Entrar

            </button>

        </form>


        <!-- CADASTRO -->
        <button
            id="signupBtn"
            class="secondary-btn full"
            type="button">

            Criar minha conta

        </button>


        <!-- MENSAGEM -->
        <p
            id="authMessage"
            class="auth-message">
        </p>


    </div>


    <!-- FIREBASE -->

    <script src="config.js"></script>

    <script
        type="module"
        src="firebase-init.js">
    </script>

    <script
        type="module"
        src="auth.js">
    </script>


</body>

</html>
